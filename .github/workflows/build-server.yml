name: Build-server

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish Laboration/Laboration.csproj -c Release -r linux-x64 --self-contained true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: server-linux-x64
          path: publish